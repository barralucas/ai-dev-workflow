[workspace]
members = ["crates/aidw-cli", "crates/aidw-core", "crates/aidw-tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lucastrindade/ai-dev-workflow"
description = "An opinionated, stack-agnostic workflow CLI for building software with AI agents"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Template & Markdown
rust-embed = "8"
pulldown-cmark = "0.12"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
